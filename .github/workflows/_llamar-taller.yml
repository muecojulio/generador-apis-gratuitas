# TEMPORAL: llama al flujo de verdad (generar-api.yml) para probarlo en esta rama.
name: Llamar al taller (temporal)

on:
  push:
    branches: ["arena/348fa0af-generador-apis-gratuitas"]
    paths: [".github/workflows/_llamar-taller.yml"]

permissions:
  contents: write

jobs:
  llamar:
    uses: ./.github/workflows/generar-api.yml
    secrets: inherit
    with:
      nombre: demo-gimnasio
      descripcion: |
        Tabla socios con campos:
        - nombre (texto, obligatorio, máximo 80)
        - correo (correo, obligatorio)
        - alta (fecha, obligatorio)
        - cuota (número, obligatorio, mínimo 0)
        - activo (sí o no)

        Tabla rutinas con campos titulo (texto, obligatorio) y nivel (texto, obligatorio).

        Quiero listar, crear, actualizar y borrar. La cuota no puede ser negativa.
      proveedor: auto
