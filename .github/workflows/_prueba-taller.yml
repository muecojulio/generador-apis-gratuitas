# TEMPORAL: comprueba el taller completo (IA gratuita + generación + commit) en
# esta rama, sin tocar main. Se borra cuando termine la validación.

name: Prueba del taller (temporal)

on:
  push:
    branches: ["arena/348fa0af-generador-apis-gratuitas"]
    paths:
      - ".github/workflows/_prueba-taller.yml"
      - "scripts/**"
      - "lib/**"

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NOMBRE: demo-recetas
      DESCRIPCION: |
        Tabla recetas con campos:
        - nombre (texto, obligatorio, máximo 120)
        - comensales (entero, obligatorio, mínimo 1)
        - tiempo_minutos (entero, obligatorio, mínimo 1)
        - dificultad (texto, obligatorio)
        - sin_gluten (sí o no)
        - fecha_publicacion (fecha)

        Tabla ingredientes con campos nombre (texto, obligatorio), cantidad (número, obligatorio, mínimo 0) y unidad (texto, obligatorio).

        Quiero listar, crear, actualizar y borrar.
        El tiempo no puede ser negativo y el nombre no puede estar vacío.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pruebas del taller
        run: npm test

      - name: ¿Qué modelos gratuitos responden?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/probar-proveedores.mjs || true

      - name: Generar una API de verdad
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/disenar.mjs

      - name: Enseñar el plano
        run: cat "api/${NOMBRE}/spec.json"

      - name: Guardar en esta rama
        run: |
          git config user.name "muecojulio"
          git config user.email "324687122+muecojulio@users.noreply.github.com"
          git add -- "api/${NOMBRE}" "lib/registro.js" "catalogo.json"
          if git diff --cached --quiet; then
            echo "Sin cambios nuevos."
            exit 0
          fi
          git commit -m "prueba: ${NOMBRE}"
          git push
          echo "Commit hecho: /api/${NOMBRE} quedará publicado tras el despliegue de Vercel."
