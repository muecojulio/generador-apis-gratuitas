# TEMPORAL: comprueba la cadena de IA gratuita y que el push funciona con las
# acciones nuevas. Se borra al terminar la validación.

name: Prueba del taller (temporal)

on:
  push:
    branches: ["arena/348fa0af-generador-apis-gratuitas"]
    paths:
      - ".github/workflows/_prueba-taller.yml"
      - "scripts/**"
      - "lib/**"

permissions:
  contents: write

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Pruebas del taller
        run: npm test

      - name: ¿Qué modelos gratuitos responden hoy?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p pruebas
          node scripts/probar-proveedores.mjs 2>&1 | tee pruebas/proveedores.txt
          echo "-----" >> pruebas/proveedores.txt
          echo "Node: $(node --version)" >> pruebas/proveedores.txt

      - name: Guardar la evidencia en esta rama
        run: |
          git config user.name "muecojulio"
          git config user.email "324687122+muecojulio@users.noreply.github.com"
          git add -- pruebas/proveedores.txt
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "prueba: evidencia de proveedores"
          git push
          echo "Push correcto con actions/checkout@v7."
