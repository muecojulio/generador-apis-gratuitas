# Compila el APK de depuración de la app nativa de Android.
#
# Se ejecuta al publicar una versión y a mano desde la pestaña Actions. El APK
# queda como artefacto descargable y, si el evento es un tag, también se adjunta
# a la Release. Todo con herramientas gratuitas de GitHub.
#
# Requisitos: ninguno por tu parte. El servidor remoto se puede fijar con la
# variable TALLER_SERVIDOR del repositorio (por defecto, el despliegue de Vercel).

name: App Android

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: app-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar estilos de la interfaz
        run: npm run css

      - name: Preparar la app (interfaz + configuración + puente nativo)
        env:
          TALLER_SERVIDOR: ${{ vars.TALLER_SERVIDOR }}
        run: npm run app:sync

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Compilar el APK de depuración
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: taller-de-apis-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Adjuntar el APK a la Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --clobber
