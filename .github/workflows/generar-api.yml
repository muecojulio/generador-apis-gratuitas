# El cerebro del taller.
#
# Se activa de dos maneras:
#   1. repository_dispatch (tipo "generar-api"): lo dispara el botón de la página.
#   2. workflow_dispatch: para lanzarlo a mano desde la pestaña Actions (pruebas).
#   3. workflow_call: para que otro flujo del mismo repositorio lo use como pieza.
#
# Qué hace, en orden: revisa el nombre, hace un diseño (IA gratuita -> lector
# incluido), escribe api/<nombre>/spec.json, actualiza el registro y el catálogo,
# y hace commit + push. Vercel detecta el cambio y publica /api/<nombre>.
#
# Coste: 0. Todo corre en la capa gratuita de GitHub Actions y de Vercel.

name: Generar API

on:
  repository_dispatch:
    types: [generar-api]
  workflow_call:
    inputs:
      nombre:
        description: "Nombre de la ruta"
        required: true
        type: string
      descripcion:
        description: "Describe tablas, campos y acciones"
        required: true
        type: string
      proveedor:
        description: "Motor de IA: auto, gemini, llm7, kilo, ovh, pollinations o incluido"
        required: false
        default: auto
        type: string
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre de la ruta (por ejemplo: tienda-barrio)"
        required: true
        type: string
      descripcion:
        description: "Describe tablas, campos y acciones"
        required: true
        type: string
      proveedor:
        description: "Motor de IA (opcional): auto, gemini, llm7, kilo, ovh, pollinations o incluido"
        required: false
        default: auto
        type: string

run-name: API ${{ github.event.client_payload.nombre || inputs.nombre }}

permissions:
  contents: write

concurrency:
  group: generar-api
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NOMBRE: ${{ github.event.client_payload.nombre || inputs.nombre }}
      DESCRIPCION: ${{ github.event.client_payload.descripcion || inputs.descripcion }}
      PROVEEDOR: ${{ inputs.proveedor || 'auto' }}

    steps:
      - name: Traer el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_PAT || github.token }}

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Comprobar el nombre
        run: |
          node --input-type=module -e "import { slugValido } from './lib/motor.mjs'; if (!slugValido(process.env.NOMBRE || '')) { console.error('Nombre rechazado: ' + JSON.stringify(process.env.NOMBRE)); process.exit(1); } console.log('Nombre aceptado: ' + process.env.NOMBRE);"

      - name: Revisar el taller antes de tocar nada
        run: node scripts/probar.mjs

      - name: Diseñar la API y escribir su carpeta
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GENERADOR_PROVEEDOR: ${{ inputs.proveedor }}
        run: node scripts/disenar.mjs

      - name: Comprobar que la API responde
        run: |
          test -f "api/${NOMBRE}/spec.json" || { echo "No se creó api/${NOMBRE}/spec.json"; exit 1; }
          node --check "api/[nombre]/index.js"
          node --check "api/[nombre]/[...ruta].js"
          node -e "
            const { registro } = require('./lib/registro.js');
            const nombre = process.env.NOMBRE;
            if (!registro[nombre]) { console.error('El registro no incluye ' + nombre); process.exit(1); }
            console.log('Registro correcto. Recursos: ' + registro[nombre].recursos.map((r) => r.nombre).join(', '));
          "

      - name: Publicar la carpeta de la API
        run: |
          git config user.name "muecojulio"
          git config user.email "324687122+muecojulio@users.noreply.github.com"
          git add -- "api/${NOMBRE}" "lib/registro.js" "catalogo.json"
          if git diff --cached --quiet; then
            echo "No hubo cambios nuevos que publicar."
            exit 0
          fi
          git commit -m "api: ${NOMBRE}"
          git push
          echo "Listo. Vercel publicará /api/${NOMBRE} en un minuto."
